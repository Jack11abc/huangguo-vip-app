name: Build unsigned IPA for HuangGuo
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 手动触发打包

jobs:
  build_ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter pre-cache ios
        run: flutter precache --ios

      - name: Pub get
        run: flutter pub get

      - name: Install pods
        run: |
          cd ios
          pod install --repo-update

      - name: Build IPA（不签名 --no-codesign）
        run: flutter build ipa --release --no-codesign --build-name=1.0.0 --build-number=1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: huangguo-unsigned-ipa
          path: build/ios/ipa/*.ipa
