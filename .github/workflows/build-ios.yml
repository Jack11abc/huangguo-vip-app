name: Build unsigned IPA for HuangGuo
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Clean old build
        run: flutter clean

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install pods
        run: |
          set -e
          flutter pub get
          cd ios
          pod install --repo-update

      - name: Build ios (只编译，不导出ipa)
        run: |
          set -e
          flutter build ios --release --no-codesign --build-name=1.0.0 --build-number=1

      - name: Find Runner.app & make Payload ipa
        run: |
          set -e
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -1)
          echo "Found app: $APP_PATH"
          mkdir -p build/ios/Payload
          cp -R "$APP_PATH" build/ios/Payload/
          cd build/ios
          zip -q -r huangguo-unsigned.ipa Payload
          rm -rf Payload
          ls -la

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v5
        with:
          name: huangguo-unsigned-ipa
          path: build/ios/huangguo-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
